<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACGNhub 设计原型</title>
<style>
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --fg: #1C1C1E; --muted: #8E8E93;
  --border: #E5E5EA; --accent: #007AFF; --accent-hover: #0056CC;
  --sidebar-bg: #F9F9FC; --sidebar-active: #E8F0FE; --player-bg: #000000;
  --anime-c: #5856D6; --comic-c: #FF9500; --novel-c: #34C759; --game-c: #AF52DE;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;display:flex}
.sidebar{width:72px;min-width:72px;background:var(--sidebar-bg);display:flex;flex-direction:column;align-items:center;padding:8px 0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:10;position:relative}
.sidebar.collapsed{width:12px;min-width:12px;padding:0;cursor:pointer}
.sidebar.collapsed .sc{display:none}
.sidebar.collapsed::after{content:'▶';position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:10px;color:var(--accent);width:12px;text-align:center}
.sidebar-toggle{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(28,28,30,.4);font-size:18px;border:none;background:0 0;border-radius:8px;margin-bottom:auto;transition:background .15s}
.sidebar-toggle:hover{background:var(--sidebar-active)}
.sidebar-nav{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.si{width:72px;display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.si:hover{background:var(--sidebar-active)}
.si.active{border-left:3px solid var(--accent)}
.si svg{width:24px;height:24px;color:rgba(28,28,30,.35);transition:color .15s}
.si.active svg{color:var(--accent)}
.si .lbl{font-size:11px;letter-spacing:.02em;margin-top:4px;color:rgba(28,28,30,.45);line-height:1.5;font-weight:400}
.si.active .lbl{color:var(--accent);font-weight:600}
.sd{width:40px;height:1px;background:var(--border);margin:4px 0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:48px;background:var(--surface);border-bottom:.5px solid var(--border);display:flex;align-items:center;padding:0 16px;flex-shrink:0}
.topbar-title{font-size:20px;font-weight:590;line-height:1.4}
.topbar-btn{margin-left:auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:rgba(28,28,30,.5);font-size:18px;border:none;background:0 0;transition:background .15s}
.topbar-btn:hover{background:var(--sidebar-active)}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
.screen{display:none;padding-bottom:24px}
.screen.active{display:block}
.bp{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:none;border-radius:12px;height:48px;padding:0 24px;font-size:15px;font-weight:590;cursor:pointer;width:100%}
.bp:hover{background:var(--accent-hover)}
.bs{display:inline-flex;align-items:center;justify-content:center;background:0 0;color:var(--accent);border:1.5px solid var(--accent);border-radius:12px;height:48px;padding:0 24px;font-size:15px;font-weight:590;cursor:pointer;width:100%}
.bs:hover{background:var(--sidebar-active)}
.bt{background:0 0;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:8px 12px}
.bt:hover{text-decoration:underline}
.pills{display:flex;gap:8px;padding:0 16px 16px}
.pill{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:510;cursor:pointer;transition:all .2s;border:1px solid var(--border);color:var(--muted);background:0 0}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill:hover:not(.active){background:var(--sidebar-active)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:0 16px 24px}
.card{cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.cc{width:100%;aspect-ratio:.75;background:var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:200;color:rgba(0,122,255,.2);overflow:hidden}
.cc img{width:100%;height:100%;object-fit:cover}
.ct{font-size:13px;font-weight:510;line-height:1.45;margin-top:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs{font-size:12px;line-height:1.5;color:rgba(28,28,30,.45);margin-top:2px}
.hero{height:240px;margin:0 16px 16px;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#1c1c1e}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .ol{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 60%)}
.hero .info{position:absolute;left:20px;right:20px;bottom:20px}
.hero .ht{font-size:24px;font-weight:600;color:#fff;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero .hs{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px}
.hero .hb{margin-top:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:none;border-radius:10px;height:36px;padding:0 20px;font-size:14px;font-weight:590;cursor:pointer}
.hero .hb:hover{background:var(--accent-hover)}
.sec-title{font-size:20px;font-weight:590;line-height:1.4;padding:0 16px 12px}
.tag{display:inline-block;padding:3px 10px;background:var(--sidebar-active);color:var(--accent);font-size:11px;font-weight:510;border-radius:20px;margin:0 6px 6px 0}
.dcover{position:relative;height:220px;background:#1c1c1e;overflow:hidden}
.dcover img{width:100%;height:100%;object-fit:cover}
.dcover::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,var(--bg) 100%)}
.dinfo{padding:16px;margin-top:-80px;position:relative;z-index:1;display:flex;gap:16px}
.dthumb{width:110px;height:154px;border-radius:10px;background:var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:200;color:rgba(0,122,255,.2);overflow:hidden}
.dthumb img{width:100%;height:100%;object-fit:cover}
.dmeta{flex:1}
.dtitle{font-size:20px;font-weight:600;line-height:1.35;margin-bottom:8px}
.meta{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.dsum{padding:0 16px;font-size:13.5px;line-height:1.65;color:rgba(28,28,30,.7);margin-bottom:12px}
.dsec{padding:4px 16px}
.dsec-title{font-size:16px;font-weight:590;margin-bottom:8px}
.elist{background:var(--surface);border-radius:12px;margin:0 16px;overflow:hidden}
.ei{display:flex;align-items:center;height:48px;padding:0 16px;cursor:pointer;border-bottom:.5px solid var(--border);font-size:14px;transition:background .15s}
.ei:hover{background:var(--sidebar-active)}
.ei:last-child{border-bottom:none}
.ei .ar{margin-left:auto;color:var(--muted);font-size:12px}
.dbar{padding:16px;background:var(--surface);border-top:.5px solid var(--border);position:sticky;bottom:0}
.player-overlay{position:fixed;inset:0;background:var(--player-bg);z-index:100;display:none;flex-direction:column}
.player-overlay.active{display:flex}
.ptop{height:48px;display:flex;align-items:center;padding:0 8px;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.ptop button{background:0 0;border:none;color:#fff;font-size:18px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.pvid{flex:1;display:flex;align-items:center;justify-content:center;background:#111}
.pvid span{font-size:64px;color:rgba(255,255,255,.15)}
.pctrl{background:rgba(0,0,0,.8);padding:12px 16px 16px;color:#fff}
.pprog{height:2px;background:rgba(255,255,255,.2);border-radius:1px;margin-bottom:12px}
.pprog-fill{width:45%;height:100%;background:var(--accent);border-radius:1px}
.pbtns{display:flex;align-items:center;gap:8px}
.pbtns button{background:0 0;border:none;color:#fff;font-size:20px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.pbtns .play{font-size:32px;color:var(--accent)}
.pbtns .spd{font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:4px 8px;width:auto;margin-left:auto}
.peps{display:flex;gap:8px;padding:8px 16px;background:rgba(0,0,0,.9);overflow-x:auto}
.peps span{padding:4px 12px;border-radius:4px;font-size:12px;white-space:nowrap;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);cursor:pointer}
.peps span.active{background:var(--accent);color:#fff}
@keyframes sh{0%,100%{opacity:.3}50%{opacity:.6}}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:16px}
.sg .scv{width:100%;aspect-ratio:.75;background:var(--border);border-radius:10px;animation:sh 1.2s infinite}
.sg .sl{height:12px;background:var(--border);border-radius:3px;margin-top:6px;animation:sh 1.2s infinite}
.sg .sl.s{width:60%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:rgba(28,28,30,.15)}
.empty .eicon{font-size:48px;margin-bottom:16px}
.empty .emsg{font-size:14px;color:rgba(28,28,30,.45)}
.reader{max-width:680px;margin:32px auto;padding:0 24px 80px;font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-size:16px;line-height:1.8}
.reader p{margin-bottom:16px}
.reader-bar{position:sticky;bottom:0;background:var(--surface);border-top:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px}
.mp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 48px);gap:16px}
.mp .mc{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.mp .mst{font-size:18px;font-weight:590}
.mp .mds{font-size:14px;color:var(--muted)}
.mp .mbd{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:510}
.caro{position:relative;height:220px;background:#1c1c1e;overflow:hidden}
.caro .cd{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.caro .cd span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);cursor:pointer}
.caro .cd span.active{width:16px;background:#fff}
.icard{background:var(--surface);border-radius:12px;margin:0 16px 16px;padding:16px}
.icard-row{display:flex;padding:8px 0;border-bottom:.5px solid var(--border);font-size:14px}
.icard-row:last-child{border-bottom:none}
.icard-row .k{color:var(--muted);width:80px;flex-shrink:0}
.icard-row .v{color:var(--fg)}
.srch{height:48px;background:var(--surface);border-bottom:.5px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:8px}
.srch input{flex:1;height:36px;background:var(--bg);border:none;border-radius:10px;padding:0 12px;font-size:15px;outline:none;color:var(--fg)}
.srch input::placeholder{color:var(--muted)}
.slist{background:var(--surface);border-radius:12px;margin:16px;overflow:hidden}
.sitem{display:flex;align-items:center;height:48px;padding:0 16px;cursor:pointer;border-bottom:.5px solid var(--border);font-size:15px;transition:background .15s}
.sitem:hover{background:var(--sidebar-active)}
.sitem:last-child{border-bottom:none}
.sitem .arw{margin-left:auto;color:var(--muted);font-size:14px}
.toc-panel{position:fixed;top:0;right:-280px;width:280px;height:100%;background:var(--surface);z-index:50;transition:right .3s ease;box-shadow:-2px 0 16px rgba(0,0,0,.1);overflow-y:auto}
.toc-panel.open{right:0}
.toc-header{padding:16px;font-size:18px;font-weight:590;display:flex;justify-content:space-between;align-items:center}
.toc-vol{padding:12px 16px 4px;font-size:15px;font-weight:590;color:var(--fg)}
.toc-ch{padding:8px 16px 8px 32px;font-size:13px;color:rgba(28,28,30,.7);cursor:pointer}
.toc-ch:hover{background:var(--sidebar-active)}
.dback{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:45;display:none}
.dback.open{display:block}
.sheet{position:fixed;bottom:-300px;left:0;right:0;background:var(--surface);z-index:50;transition:bottom .3s ease;border-radius:16px 16px 0 0;padding:20px 24px 32px;box-shadow:0 -2px 16px rgba(0,0,0,.1)}
.sheet.open{bottom:0}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle sc" onclick="toggleSidebar()">☰</button>
  <nav class="sidebar-nav sc" id="sideNav">
    <div class="si active" onclick="go('anime-home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="lbl">动漫</span></div>
    <div class="si" onclick="go('comic-home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M4 10h16"/><line x1="12" y1="10" x2="12" y2="18"/></svg><span class="lbl">漫画</span></div>
    <div class="si" onclick="go('novel-home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span class="lbl">轻小说</span></div>
    <div class="si" onclick="go('game-home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><line x1="7" y1="15" x2="10" y2="15"/><line x1="12" y1="12" x2="12" y2="18"/></svg><span class="lbl">游戏</span></div>
  </nav>
  <div class="sd sc"></div>
  <div class="si sc" onclick="go('settings',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span class="lbl">设置</span></div>
</aside>

<div class="main">
  <div class="topbar"><span class="topbar-title" id="topTitle">动漫</span><div class="topbar-btn" onclick="toggleSearch()">🔍</div></div>
  <div class="content" id="content"></div>
</div>

<div class="player-overlay" id="player">
  <div class="ptop"><button onclick="closePlayer()">←</button><span>第 3 集 · 命运之夜</span></div>
  <div class="pvid"><span>▶</span></div>
  <div class="peps"><span>第1集 ✓</span><span>第2集 ✓</span><span class="active">第3集</span><span>第4集</span><span>第5集</span><span>第6集</span></div>
  <div class="pctrl"><div class="pprog"><div class="pprog-fill"></div></div><div class="pbtns"><button>◁◁</button><button class="play">▶</button><button>▷▷</button><button class="spd">1.0x</button></div></div>
</div>

<div class="dback" id="backdrop" onclick="closeTOC()"></div>
<div class="toc-panel" id="tocPanel">
  <div class="toc-header">目录 <span style="cursor:pointer;font-size:16px;color:var(--muted)" onclick="closeTOC()">✕</span></div>
  <div class="toc-vol">第一卷</div>
  <div class="toc-ch" onclick="go('novel-reader');closeTOC()">序章 · 死亡与转生</div>
  <div class="toc-ch" onclick="go('novel-reader');closeTOC()">第一章 · 洞穴中的日常</div>
  <div class="toc-ch" onclick="go('novel-reader');closeTOC()">第二章 · 与哥布林族的相遇</div>
  <div class="toc-vol">第二卷</div>
  <div class="toc-ch" onclick="go('novel-reader');closeTOC()">第一章 · 新的冒险</div>
  <div class="toc-ch" onclick="go('novel-reader');closeTOC()">第二章 · 试炼</div>
</div>

<div class="sheet" id="settingsSheet">
  <div style="font-size:18px;font-weight:590;margin-bottom:16px">阅读设置</div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="font-size:14px">字号</span><input type="range" min="12" max="24" value="16" style="flex:1;accent-color:var(--accent)" id="fontSize"><span style="font-size:14px;font-weight:600" id="fontSizeVal">16</span></div>
  <div style="font-size:14px;margin-bottom:8px">行距</div>
  <div style="display:flex;gap:8px;margin-bottom:16px" id="lineGap"><span class="pill" onclick="selPill(this,'lineGap')">紧凑 1.5</span><span class="pill active" onclick="selPill(this,'lineGap')">标准 1.8</span><span class="pill" onclick="selPill(this,'lineGap')">宽松 2.2</span></div>
  <div style="font-size:14px;margin-bottom:8px">主题</div>
  <div style="display:flex;gap:8px" id="themeSel"><span class="pill active" onclick="selPill(this,'themeSel')">日间</span><span class="pill" onclick="selPill(this,'themeSel')">护眼</span><span class="pill" onclick="selPill(this,'themeSel')">夜间</span></div>
</div>

<script>
const T = {
  'anime-home':'动漫','comic-home':'漫画','novel-home':'轻小说','game-home':'游戏',
  'anime-search':'搜索动漫','anime-detail':'详情','comic-detail':'详情',
  'novel-detail':'详情','novel-reader':'阅读','game-detail':'详情','settings':'设置'
};

const ANIME = ['葬送的芙莉莲','迷宫饭','药屋少女的呢喃','我心里危险的东西','BanG Dream!','吹响吧！上低音号','跃动青春','天国大魔境','不死不幸','香格里拉边境','我推的孩子','夏日重现'];
const COMIC = ['海贼王','咒术回战','间谍过家家','怪兽8号','坂本日常','胆大党','蓝色监狱','电锯人','我推的孩子','终末的女武神'];
const NOVEL = ['关于我转生变成史莱姆这档事','无职转生','Re:从零开始的异世界生活','盾之勇者成名录','为美好的世界献上祝福','Overlord','哥布林杀手','平凡职业成就世界最强'];
const GAME = ['サクラノ刻','アマカノ2','天使☆騒々','創作彼女の恋愛公式','金色ラブリッチェ','喫茶ステラと死神の蝶','RIDDLE JOKER','千恋＊万花'];

let activeScreen = 'anime-home';

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

function go(id, el) {
  if (el) { document.querySelectorAll('.si').forEach(i=>i.classList.remove('active')); el.classList.add('active'); }
  activeScreen = id;
  document.getElementById('topTitle').textContent = T[id]||'';
  document.querySelector('.topbar-btn').style.display = id.includes('home')?'':'none';
  render(id);
}

function toggleSearch() {
  if (activeScreen.includes('home')) { go(activeScreen.replace('home','search')); }
}

function selPill(el, gid) {
  document.querySelectorAll('#'+gid+' .pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}

function Cards(titles, src, n) {
  let h='<div class="grid">';
  for(let i=0;i<(n||12);i++){
    const t=titles[i%titles.length];
    h+=`<div class="card" onclick="go('${src}-detail')"><div class="cc">${t[0]}</div><div class="ct">${t}</div><div class="cs">${src==='anime'?'Bangumi':src==='comic'?'漫画源A':'轻小说文库'}</div></div>`;
  }
  return h+'</div>';
}

function Shimmer() {
  let h='<div class="sg">';
  for(let i=0;i<12;i++) h+='<div><div class="scv"></div><div class="sl"></div><div class="sl s"></div></div>';
  return h+'</div>';
}
